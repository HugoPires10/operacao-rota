function campaignMap(){const step=routeStage(),points=[[70,65],[220,65],[370,65],[520,65],[520,210],[370,210],[220,210],[70,210],[70,355],[220,355],[370,355],[520,355]],paint=PAINTS.find(x=>x.id===garage.paint),stripe=STRIPES.find(x=>x.id===garage.stripe);return `<div class="boardmap"><div class="boardcaption"><span>DISTRITO ${Math.floor(Math.max(0,stats.completed-1)/12)+1} · SUA CAMPANHA</span><span>${stats.completed} vitórias</span></div><svg viewBox="0 0 600 440" role="img" aria-label="Tabuleiro: ${step} de 12 pontos conquistados"><defs><pattern id="campaignGrid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0v30" fill="none" stroke="#25404c" stroke-width=".7"/></pattern></defs><rect width="600" height="440" rx="12" fill="url(#campaignGrid)"/><path d="M25 65H520V210H70V355H520" fill="none" stroke="#344b57" stroke-width="28" stroke-linejoin="round"/><path d="M25 65H520V210H70V355H520" fill="none" stroke="#718692" stroke-width="2" stroke-dasharray="7 10"/>${points.map(([x,y],i)=>`<g><circle cx="${x}" cy="${y}" r="29" fill="${i<step?'#315c4b':'#1a2d39'}" stroke="${i===step-1?'#f4ce7a':i<step?'#88b7a1':'#5e7886'}" stroke-width="${i===step-1?4:2}"/><text x="${x}" y="${y+6}" text-anchor="middle" fill="${i<step?'#d8f0e3':'#c0cfda'}" font-family="Arial" font-weight="700" font-size="20">${i<step?'✓':i+1}</text><text x="${x}" y="${y+50}" text-anchor="middle" fill="#d6e1e6" font-family="Arial" font-size="15">${PLACES[i]}</text>${REWARDS.some(r=>r.at===i+1)?`<rect x="${x+17}" y="${y-33}" width="18" height="18" rx="4" fill="#d9b765"/><path d="M${x+26} ${y-30}v12m-6-6h12" stroke="#1a2d39" stroke-width="2"/>`:''}</g>`).join('')}${(()=>{const p=step===0?[25,65]:points[step-1];return `<g transform="translate(${p[0]-18} ${p[1]-25})"><rect width="36" height="51" rx="9" fill="${paint.color}" stroke="#102330" stroke-width="3"/><path d="M3 26h30" stroke="${stripe.color}" stroke-width="7"/><rect x="7" y="7" width="22" height="11" rx="3" fill="#183748"/><rect x="7" function cardView(card,button=false){const color=COLORS.find(c=>c.id===card.color),w=wordFor(card),action=ACTIONS[card.kind],value=card.kind==='number'?card.value:action.symbol,name=w?w.w:action.name;const enabled=button&&screen==='game'&&g.phase==='player'&&!pause&&!settings&&!tutorial&&!evidence,valid=button&&legal(card)&&(g.drawn===null||g.drawn===card.id);return `<${button?'button':'div'} class="tcard ${card.color==='wild'?'wild':''} ${enabled&&valid&&prefs.hints?'playable':''} ${button&&g.drawn===card.id?'held':''}" style="--card:${color?color.hex:'#263747'};--cardink:${color?color.ink:'#ffffff'}" ${button?`data-card="${card.id}" aria-label="${color?color.name:'Coringa'}, ${value}, ${name}${valid?', pode jogar':''}" ${!enabled?'disabled':''}`:''}><span class="cardtop"><span>${value}</span><small>${color?color.shape+' '+color.name:'✚ LIVRE'}</small></span><span class="cardface"><span class="number">${value}</span>${icon(w?w.i:action.i,'cardicon')}</span><span class="cardword">${name}</span><span class="cardbottom">${value} · ROTA 07</span></${button?'button':'div'}>`}

function boardView(finish=false){const won=finish&&g.result==='player',latest=won?REWARDS.find(r=>r.at===stats.completed):null,next=REWARDS.find(r=>r.at>stats.completed),champ=scores.player>=500||scores.bot>=500;return `<section class="boardpage"><div class="boardintro"><div><div class="status">${finish?(won?'VITÓRIA · VIATURA AVANÇOU':'RODADA DA CENTRAL'):'CAMPANHA POLICIAL'}</div><h1 tabindex="-1">${finish?(won?'Próximo ponto conquistado.':'A rota continua aqui.'):'Seu tabuleiro de operações'}</h1><p>${finish?(won?'Você venceu e avançou uma casa.':'A central venceu esta rodada. Sua posição foi mantida.'):'Cada vitória conquista um ponto e libera novas personalizações.'}</p></div><button class="btn" data-action="garage">Garagem</button></div>${finish?`<div class="finishstats"><div><strong>+${g.roundPoints}</strong><small>pontos ${won?'para você':'para a central'}</small></div><div><strong>${scores.player} × ${scores.bot}</strong><small>placar · meta 500</small></div><div><strong>${stats.completed}</strong><small>vitórias na campanha</small></div></div>${champ?`<p class="phasepill">Partida de 500 pontos encerrada. ${scores.player>=500?'Sua equipe venceu!':'A central venceu.'} A próxima partida começa em zero.</p>`:''}`:''}${campaignMap()}${latest?`<div class="unlockbox"><div><strong>DESBLOQUEADO · ${latest.name}</strong><small>${latest.type} para sua viatura. Experimente na garagem.</small></div><button class="btn primary" data-action="garage">Personalizar →</button></div>`:next?`<div class="unlockbox"><div><strong>Próximo: ${next.name}</strong><small>Libera com ${next.at} vitórias · faltam ${next.at-stats.completed}.</small></div><span aria-hidden="true">▣</span></div>`:'<div class="unlockbox"><div><strong>Garagem completa.</strong><small>Todos os itens foram desbloqueados. Continue conquistando distritos.</small></div></div>'}<div class="boardactions"><button class="btn primary" data-action="nextRound">▶ ${finish?'Próxima rodada':'Jogar operação'}</button><button class="btn" data-action="home">⌂ Tela inicial</button></div></section>`}

function settingsView(){return `<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="setTitle"><div class="tiny">AJUSTES</div><h2 id="setTitle">Apoios da operação</h2>${voicePanel()}${[['sound','Áudio do jogo','Ativa as instruções e a leitura dos itens.'],['narration','Instruções faladas','Explica o que fazer ao abrir uma atividade.'],['touchVoice','Ler ao tocar','Fala o item escolhido, a letra ou a sílaba.'],['hints','Apoio visual','Destaca cartas válidas e nomes nas pistas.'],['clues','Aprender a cada jogada','Palavras, imagens, letras e sílabas após suas jogadas.'],['large','Cartas e texto maiores','Amplia as cartas da sua mão.'],['motion','Animação das cartas','Movimento suave da mão até a mesa.']].map(([k,label,small])=>`<label class="settingsrow"><span>${label}<small>${small}</small></span><select data-pref="${k}"><option value="false" ${!prefs[k]?'selected':''}>Desligado</option><option value="true" ${prefs[k]?'selected':''}>Ligado</option></select></label>`).join('')}<label class="settingsrow"><span>Ritmo da central<small>A central sempre joga automaticamente.</small></span><select data-pref="pace">${[[1700,'Normal'],[3000,'Tranquilo'],[4500,'Bem tranquilo']].map(([v,l])=>`<option value="${v}" ${prefs.pace===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="settingsrow"><span>Tempo para observar a carta<small>Pausa após a central jogar.</small></span><select data-pref="botHold">${[[1500,'Curto'],[2400,'Tranquilo'],[4000,'Mais tempo']].map(([v,l])=>`<option value="${v}" ${prefs.botHold===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="settingsrow"><span>Velocidade da voz</span><select data-pref="voiceRate">${[[.78,'Mais devagar'],[.88,'Devagar'],[.97,'Normal']].map(([v,l])=>`<option value="${v}" ${prefs.voiceRate===v?'selected':''}>${l}</option>`).join('')}</select></label>${learningSettingsRows()}<p class="micro">Sem limite de tempo para suas decisões. Progresso e garage function rulesView(){return `<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="rulesTitle"><div class="tiny">CARTAS DA OPERAÇÃO · 2 JOGADORES</div><h2 id="rulesTitle">Cor, número ou símbolo.</h2><p>São 108 cartas e 7 por equipe. Jogue uma combinação ou compre uma carta. Depois da compra, só a carta comprada pode ser jogada.</p><p><strong>Bloqueio e retorno:</strong> o outro passa. <strong>+2:</strong> o outro compra 2 e passa. <strong>Coringa:</strong> escolha a cor. <strong>+4:</strong> só é regular sem outra carta da cor atual; pode ser contestado. Não há acúmulo de +2 ou +4.</p><p><strong>Contestar +4:</strong> irregular, quem jogou recebe 4; regular, quem contestou recebe 6. As cartas são reveladas na contestação.</p><p><strong>ÚLTIMA CARTA!</strong> Toque no botão ao ficar com uma carta. Se a central perceber a omissão antes de jogar, você compra 2.</p><p>Ganha a rodada quem termina a mão. Números valem seu valor, ações 20 e coringas 50. A primeira equipe a somar 500 vence a partida. Cada vitória em rodada também avança o tabuleiro.</p><p class="micro">Aviso de última carta por toque, sem precisar falar. Retorno funciona como bloqueio quando há dois jogadores.</p><div class="dialogactions"><button class="btn primary" data-action="closeRules">Entendi ✓</button></div></section></div>`}
function modal(title,body,actions,eyebrow='MENSAGEM DA CENTRAL'){return `<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="tiny">${eyebrow}</div><h2 id="modalTitle">${title}</h2>${body}<div class="dialogactions">${actions}</div></section></div>`}
function baseOverlay(){if(pause)return modal('Pausa na operação.','<p>Suas cartas e a vez atual foram mantidas.</p>','<button class="btn primary" data-action="resume">▶ Retomar</button><button class="btn" data-action="home">Encerrar e voltar</button>');if(settings)return settingsView();if(tutorial)return rulesView();if(evidence)return evidenceView();if(screen==='brief')return modal(MISSIONS[selectedMission].title,`<p>${MISSIONS[selectedMission].description}</p><p>Regras clássicas: 108 cartas, 7 por equipe e central automática. Vença a rodada para avançar no tabuleiro.</p>`, '<button class="btn primary" data-action="start">▶ Iniciar operação</button><button class="btn" data-action="home">Voltar</button>','BRIEFING DA OPERAÇÃO');if(screen!=='game'||!g)return '';
 if(['color','initialColor'].includes(g.phase))return modal('Escolha a próxima cor.','<div class="colorchoices">'+COLORS.map(c=>`<button class="colorchoice" style="--card:${c.hex};--cardink:${c.ink}" data-color="${c.id}">${c.shape} ${c.name}</button>`).join('')+'</div>','',g.phase==='initialColor'?'CORINGA NA ABERTURA':'CORINGA');

 if(g.phase==='bluff')return modal('Você ainda tem a cor atual.','<p>Jogar +4 nesta situação é irregular. Se a central contestar, você compra 4.</p>','<button class="btn primary" data-action="cancelBluff">Escolher outra carta</button><button class="btn" data-action="bluff">Jogar +4 mesmo assim</button>','REGRA DO +4');

function render(){const old=document.querySelector('#handRow'),scroll=old?old.scrollLeft:0,oldOpponent=document.querySelector('#opponentRow'),opponentScroll=oldOpponent?oldOpponent.scrollLeft:0;document.documentElement.classList.toggle('larger',!!prefs.large);document.documentElement.classList.toggle('game-fit',screen==='game');app.innerHTML=header()+`<main class="main">${screen==='game'?gameView():screen==='finish'?boardView(true):screen==='board'?boardView():screen==='garage'?garageView():screen==='archive'?archiveView():home()}</main><footer class="footer">OPERAÇÃO ROTA · VERSÃO 14 · CARTAS ORIGINAIS<br>Jogo independente de cartas e atividades de leitura.</footer>`+overlay();const row=document.querySelector('#handRow');if(row)row.scrollLeft=scroll;const opponentRow=document.querySelector('#opponentRow');if(opponentRow)opponentRow.scrollLeft=opponentScroll;const dialog=document.querySelector('.dialog');if(dialog){const b=dialog.querySelector('button,select');if(b)b.focus()}flushFlight();syncAuto();installReadScreenButton();announceTurn()}

function voiceRank(v){return (/^pt[-_]BR$/i.test(v.lang)?100:0)+(/natural|neural|enhanced|premium|siri/i.test(v.name)?90:0)+(/google|francisca|antonio|luciana/i.test(v.name)?50:0)+(!v.localService?20:0)}
function voiceEscape(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function voiceChoices(){loadVoices();const voices=voiceState.voices.filter(v=>/^pt([-_]|$)/i.test(v.lang)).sort((a,b)=>voiceRank(b)-voiceRank(a));return '<label class="voice-choice">Voz de leitura<select data-voice-choice><option value="">Automática · melhor disponível</option>'+voices.map(v=>'<option value="'+voiceEscape(v.voiceURI)+'" '+(prefs.voiceURI===v.voiceURI?'selected':'')+'>'+voiceEscape(v.name)+'</option>').join('')+'</select></label><small>Instruções curtas explicam a atividade. Toque nos itens para ouvir. Você pode escolher outra voz nesta lista; a qualidade depende das vozes instaladas no aparelho.</small>'}
app.addEventListener('change',event=>{if(event.target.hasAttribute&&event.target.hasAttribute('data-voice-choice')){prefs.voiceURI=event.target.value;save();speak('Olá. Vamos jogar.',true)}});

let restartConfirm=false,heldLesson=null;
ACTIONS.wild.name='CORINGA';ACTIONS.draw4.name='CORINGA +4';ACTIONS.draw2.name='COMPRAR 2';
function activeRound(){return !!(g&&g.phase!=='done'&&g.player&&g.bot)}
function homeAction(){cancelAuto();soundStop();if(activeFlight){activeFlight.remove();activeFlight=null}pendingFlight=null;if(screen==='game'&&evidence&&!evidence.practice)heldLesson=evidence;evidence=null;screen='home';pause=false;settings=false;tutorial=false;restartConfirm=false;notice='';render()}
function resumeRound(){if(!activeRound())return;screen='game';evidence=heldLesson;heldLesson=null;pause=false;settings=false;tutorial=false;restartConfirm=false;render()}
function overlay(){
 if(restartConfirm)return modal('Reiniciar esta rodada?','<p>As cartas serão distribuídas de novo.</p><p>Seu avanço no tabuleiro e os itens da garagem continuam salvos.</p>','<button class="btn primary" data-action="confirmRestart">↻ Sim, reiniciar</button><button class="btn" data-action="cancelRestart">Voltar</button>','NOVA RODADA');
 if(pause)return `<div class="overlay"><section class="dialog navigation-dialog" role="dialog" aria-modal="true" aria-labelledby="menuTitle"><div class="tiny">JOGO EM PAUSA</div><h2 id="menuTitle">O que você quer fazer?</h2><div class="navigation-actions"><button class="nav-action main" data-action="resume"><span aria-hidden="true">▶</span><div><strong>Continuar jogando</strong><small>Voltar para suas cartas.</small></div></button>${screen==='game'?'<button class="nav-action" data-action="askRestart"><span aria-hidden="true">↻</span><div><strong>Reiniciar rodada</strong><small>Receber novas cartas.</small></div></button>':''}<button class="nav-action" data-action="home"><span aria-hidden="true">⌂</span><div><strong>Tela inicial</strong><small>${activeRound()?'A rodada fica pausada neste acesso.':'Escolher outra atividade.'}</small></div></button></div><div class="navigation-tools"><button class="btn" data-action="menuSettings">⚙ Som e ajustes</button><button class="btn" data-action="menuRules">? Como jogar</button><button class="btn" data-action="fullscreen">⛶ Tela inteira</button></div></section></div>`;
 if(!settings&&!tutorial&&!evidence&&screen==='game'&&g&&['color','initialColor'].includes(g.phase))return `<div class="overlay color-overlay"><section class="dialog color-dialog" role="dialog" aria-modal="true" aria-labelledby="colorTitle"><div class="tiny">SUA ESCOLHA</div><h2 id="colorTitle">Escolha uma cor</h2><p class="color-instruction">Toque na cor da próxima jogada.</p><div class="clear-color-options">${COLORS.map(color=>`<button class="clear-color-button" style="--choice-color:${color.hex};--choice-ink:${color.ink}" data-color="${color.id}"><span class="color-symbol" aria-hidden="true">${color.shape}</span><strong>${color.name}</strong><small>Escolher ${color.name.toLowerCase()}</small></button>`).join('')}</div><div class="color-help">Todas as cores podem ser escolhidas.</div><button class="btn color-menu" data-action="pause">☰ Menu</button></section></div>`;
 return baseOverlay();
}
app.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;switch(b.dataset.action){case'resumeRound':resumeRound();break;case'askRestart':cancelAuto();pause=false;restartConfirm=true;render();break;case'confirmRestart':{const mission=g?g.mission:selectedMission;restartConfirm=false;initGame(mission);break}case'cancelRestart':restartConfirm=false;pause=true;render();break;case'menuSettings':pause=false;settings=true;render();break;case'menuRules':pause=false;tutorial=true;render();break;}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&restartConfirm){restartConfirm=false;pause=true;render()}});

prefs.narration=prefs.narration!==false;prefs.touchVoice=prefs.touchVoice!==false;
function touchSpeak(text){if(prefs.sound&&prefs.touchVoice)speak(text,true)}
function lessonInstruction(){if(!evidence)return '';const word=evidence.target.w;switch(evidence.kind){case'match':return 'Toque no nome deste objeto.';case'image':return 'Encontre a imagem de '+word+'.';case'letters':return 'Monte a palavra '+word+'. Toque nas letras em ordem.';case'syllables':return 'Monte a palavra '+word+'. Toque nas sílabas em ordem.';default:return 'Escolha uma opção.'}}
function narrateLesson(force=false){if(!evidence)return;if(force)speak(lessonInstruction(),true);else if(prefs.sound&&prefs.narration)speak(lessonInstruction())}
function narrateScreen(){if(prefs.sound&&prefs.narration)speakCurrentScreen(true)}
// Capture a direct user touch before the game changes the selected card or color.
app.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.card!==undefined&&prefs.sound&&prefs.touchVoice&&g){const card=g.player.find(c=>c.id===+b.dataset.card);if(card){const word=wordFor(card);touchSpeak(word?word.w:card.color==='wild'?nameFor(card)+'. Escolha uma cor.':nameFor(card))}}if(b.dataset.color)touchSpeak(COLORS.find(c=>c.id===b.dataset.color).name)},true);
app.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.readVocab!==undefined){const word=VOCAB.find(w=>w.id===+b.dataset.readVocab);if(word)speak(word.w,true);return}switch(b.dataset.action){case'listenInstruction':narrateLesson(true);break;case'clueHint':if(evidence){if(['letters','syllables'].includes(evidence.kind)){const parts=evidence.kind==='letters'?[...evidence.target.w]:evidence.target.s;speak('Procure '+(parts[evidence.selected.length]||evidence.target.w)+'.',true)}else speak('A resposta está destacada.',true)}break;case'start':case'nextRound':case'pause':case'archive':case'quickstart':narrateScreen();break;}});

let lastSpokenTurn='',turnVoiceTimer=null;
function turnStateKey(){if(screen!=='game'||!g||pause||settings||tutorial||evidence||restartConfirm||document.hidden||!['central','player'].includes(g.phase))return '';return epoch+':'+g.phase+':'+g.top.id+':'+g.moves}
function turnPhrase(){return g.phase==='central'?'A central está jogando.':'Sua vez.'}
function readTurnNow(force=false){const key=turnStateKey();if(!key||(!force&&(!prefs.sound||!prefs.narration||!voiceState.unlocked)))return;if(turnVoiceTimer!==null){clearTimeout(turnVoiceTimer);turnVoiceTimer=null}lastSpokenTurn=key;speak(turnPhrase(),force)}
function announceTurn(){if(turnVoiceTimer!==null){clearTimeout(turnVoiceTimer);turnVoiceTimer=null}const key=turnStateKey();if(!key||key===lastSpokenTurn||!prefs.sound||!prefs.narration||!voiceState.unlocked)return;let checks=0;function attempt(){turnVoiceTimer=null;if(turnStateKey()!==key||key===lastSpokenTurn||!prefs.sound||!prefs.narration)return;const synth=window.speechSynthesis;if(voiceState.current||synth&&(synth.speaking||synth.pending)){if(checks++<32)turnVoiceTimer=setTimeout(attempt,250);return}readTurnNow(false)}turnVoiceTimer=setTimeout(attempt,180)}

let interfaceVoiceKey='',interfaceVoiceTimer=null,decisionPreview=null;
if(prefs.completeAudioRevision!==1){prefs.sound=true;prefs.narration=true;prefs.touchVoice=true;prefs.completeAudioRevision=1;save()}
function interfaceSpeech(){
 if(document.hidden)return null;const prefix=epoch+':'+screen+':';
 if(restartConfirm)return {key:prefix+'restart',text:'Reiniciar esta rodada? As cartas serão distribuídas de novo. Seu avanço continua salvo. Escolha sim, reiniciar, ou voltar.'};
 if(pause)return {key:prefix+'menu',text:'Jogo em pausa. Você pode continuar jogando, reiniciar a rodada ou voltar para a tela inicial. Abaixo estão som e ajustes, como jogar e tela inteira.'};
 if(settings)return {key:prefix+'settings',text:'Som e ajustes. Toque para testar a voz. Você pode escolher a voz, a velocidade e os apoios do jogo.'};
 if(tutorial)return {key:prefix+'rules',text:'Combine a cor, o número ou o símbolo da carta. Sem uma combinação, compre uma carta. Ao ficar com uma carta, anuncie última carta pelo botão.'};
 if(evidence){if(evidence.solved)return {key:prefix+'correct:'+stats.exercises,text:'Você acertou. '+evidence.target.w+'. Toque em continuar.'};if(evidence.message)return {key:prefix+'feedback:'+evidence.kind+':'+evidence.target.id+':'+evidence.message,text:evidence.message};return null}
 if(screen==='game'&&g){const key=prefix+g.phase+':'+g.top.id+':'+g.moves;
  if(['color','initialColor'].includes(g.phase))return {key,text:'Escolha a cor da próxima jogada. As opções são azul, vermelho, verde e amarelo. Toque na cor que você quer.'};
  if(g.phase==='challenge')return {key,text:'A central jogou coringa mais quatro. Aceitar: você compra quatro cartas e passa a vez. Contestar: verificar se a jogada foi permitida. Se a contestação estiver errada, você compra seis cartas. Toque em uma opção para ouvir e toque novamente para confirmar.'};
  if(g.phase==='botChallenge')return {key,text:'A central está verificando seu coringa mais quatro.'};
  if(g.phase==='challengeResult')return {key,text:g.challenge.result+' Toque em continuar.'};
  if(g.phase==='bluff')return {key,text:'Você ainda tem a cor atual. Se jogar mais quatro e a central contestar, você recebe quatro cartas. Escolha outra carta ou confirme jogar mesmo assim.'};
  if(g.phase==='uno')return {key,text:'Você tem uma carta. Toque em última carta para anunciar.'};
  if(g.phase==='central'||g.phase==='player')return {key:key+':'+notice,text:(g.phase==='central'?'A central está jogando.':'Sua vez.')+(notice&&/compr|receb|passou|Procure|Após comprar/i.test(notice)?' '+notice:'')};
  return null;
 }
 if(screen==='brief')return {key:prefix+'brief:'+selectedMission,text:MISSIONS[selectedMission].title+'. '+MISSIONS[selectedMission].description+' Toque em iniciar operação.'};
 if(screen==='finish')return {key:prefix+'result:'+stats.rounds,text:(g.result==='player'?'Você venceu! Sua viatura avançou no tabuleiro.':'A central venceu esta rodada. Seu avanço foi mantido.')+' Toque em próxima rodada para jogar de novo, ou garagem para personalizar.'};
 if(screen==='board')return {key:prefix+'board:'+stats.completed,text:'Seu tabuleiro de operações. Você tem '+stats.completed+' vitórias. Cada vitória avança uma casa. Escolha jogar operação, garagem ou tela inicial.'};
 if(screen==='garage')return {key:prefix+'garage',text:'Garagem da viatura. Escolha uma pintura, uma faixa ou rodas. Toque nos itens para ouvir os nomes. Os itens bloqueados informam quantas vitórias faltam.'};
 if(screen==='archive')return {key:prefix+'archive',text:'Palavras e desafios. Escolha palavras, imagens, letras ou sílabas. Toque nos objetos para ouvir os nomes.'};
 if(screen==='home')return {key:prefix+'home',text:'Tela inicial. Toque em '+(activeRound()?'continuar rodada para voltar ao jogo.':'iniciar operação para jogar.')+' Você também pode escolher garagem, mapa da campanha ou palavras e desafios.'};
 return null;
}
function speakCurrentScreen(force=false){const state=interfaceSpeech();if(!state&&evidence){narrateLesson(force);return}if(!state||(!force&&(!prefs.sound||!prefs.narration)))return;if(interfaceVoiceTimer!==null){clearTimeout(interfaceVoiceTimer);interfaceVoiceTimer=null}interfaceVoiceKey=state.key;speak(state.text,force)}
function announceTurn(){if(turnVoiceTimer!==null){clearTimeout(turnVoiceTimer);turnVoiceTimer=null}if(interfaceVoiceTimer!==null){clearTimeout(interfaceVoiceTimer);interfaceVoiceTimer=null}const state=interfaceSpeech();if(!state||state.key===interfaceVoiceKey||!prefs.sound||!prefs.narration||!voiceState.unlocked)return;let waits=0;function attempt(){interfaceVoiceTimer=null;const current=interfaceSpeech();if(!current||current.key!==state.key||state.key===interfaceVoiceKey||!prefs.sound||!prefs.narration)return;const synth=window.speechSynthesis;if(voiceState.current||synth&&(synth.speaking||synth.pending)){if(waits++<120)interfaceVoiceTimer=setTimeout(attempt,250);return}speakCurrentScreen(false)}interfaceVoiceTimer=setTimeout(attempt,180)}
function previewDecision(choice){if(!g||g.phase!=='challenge')return;const key=epoch+':'+g.top.id;if(decisionPreview&&decisionPreview.key===key&&decisionPreview.choice===choice){decisionPreview=null;soundStop();resolveChallenge(choice==='contest');if(prefs.sound)speak(choice==='accept'?'Aceito. Você recebe quatro cartas.':'Vamos verificar a jogada.',true);return}decisionPreview={key,choice};if(prefs.sound)speak(choice==='accept'?'Aceitar. Você recebe quatro cartas e passa a vez. Toque outra vez em aceitar para confirmar.':'Contestar. Verificar a jogada da central. Se estiver errada, a central recebe quatro cartas. Se estiver certa, você recebe seis. Toque outra vez em contestar para confirmar.',true);if(document.querySelectorAll)for(const old of document.querySelectorAll('.decision-selected')){old.classList.remove('decision-selected');old.setAttribute('aria-pressed','false')}const b=document.querySelector('[data-action="'+(choice==='accept'?'previewAccept':'previewContest')+'"]');if(b){b.classList.add('decision-selected');b.setAttribute('aria-pressed','true')}}
function installReadScreenButton(){if(!document.createElement)return;const dialog=document.querySelector('.dialog');if(!dialog||dialog.querySelector('[data-action="readScreen"]'))return;const button=document.createElement('button');button.className='btn read-screen-button';button.dataset.action='readScreen';button.textContent='◖ Ouvir esta tela';dialog.appendChild(button)}
app.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;const action=b.dataset.action;if(action==='previewAccept'){previewDecision('accept');return}if(action==='previewContest'){previewDecision('contest');return}if(action==='readScreen'){speakCurrentScreen(true);return}
 // Read controls not already handled by word/tile/color readers.
 if(!prefs.sound||!prefs.touchVoice||b.dataset.card!==undefined||b.dataset.color||b.dataset.evidence!==undefined||b.dataset.learnTile!==undefined||b.dataset.vocab!==undefined||b.dataset.readVocab!==undefined||b.dataset.practice||['sound','testVoice','testTone','listenInstruction','listenClue','start','nextRound','pause','archive','quickstart'].includes(action))return;
 const label=b.getAttribute&&b.getAttribute('aria-label')||b.querySelector&&b.querySelector('strong')&&b.querySelector('strong').textContent||b.textContent;if(label)speak(String(label).replace(/^[^\p{L}\p{N}]+/u,'').replace(/\s+/g,' ').trim().slice(0,180),true);
});
app.addEventListener('change',event=>{const field=event.target;if(!prefs.sound||!field.selectedOptions||!field.selectedOptions[0])return;speak('Selecionado. '+field.selectedOptions[0].textContent,true)});

render();</script></body></html>
